[project]
name = "living-corpus-rag"
version = "0.1.0"
description = "Version-aware RAG system over Pydantic documentation"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "weaviate-client>=4.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "retrieval", "graph", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
